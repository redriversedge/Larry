[build]
  publish = "."
  functions = "netlify/functions"

# Note on function timeouts: Netlify's synchronous limit is 10s and is not
# raisable on the free tier, so rather than declaring a timeout here that
# may be silently ignored, larry-chat aborts its own Claude request at 9s.
# That way a slow reply returns a real error message instead of a bare 502.
# If this site moves to a paid plan, add a [functions] timeout here and
# raise the matching constant in the function.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Phase 2 cookie flow. /link receives the bookmarklet redirect and
# /connect serves the install page. Both are static rewrites so the
# fragment (#token=...) reaches the client unchanged.
[[redirects]]
  from = "/link"
  to = "/public/link.html"
  status = 200

[[redirects]]
  from = "/connect"
  to = "/public/connect-bookmarklet.html"
  status = 200
