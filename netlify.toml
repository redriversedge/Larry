[build]
  publish = "."
  functions = "netlify/functions"

# Note on function timeouts: the 10s limit applies to a BUFFERED response.
# A streamed response is not bound by it. Measured on this site on
# 2026-10-23: a 30-second streaming probe delivered all 31 of its lines
# unbuffered and closed at 29.4s, first byte at ~350ms. See the "Measured"
# section of docs/CHAT_TIMEOUT_SPEC.md.
#
# So larry-chat streams (netlify/functions/larry-chat.mjs, Functions v2) and
# caps itself at 25s rather than aborting at 9s. larry-move is still a
# buffered call and still has to fit inside 10s, which is why it keeps its
# own 8.5s abort.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# Phase 2 cookie flow. /link receives the bookmarklet redirect and
# /connect serves the install page. Both are static rewrites so the
# fragment (#token=...) reaches the client unchanged.
[[redirects]]
  from = "/link"
  to = "/public/link.html"
  status = 200

[[redirects]]
  from = "/connect"
  to = "/public/connect-bookmarklet.html"
  status = 200
