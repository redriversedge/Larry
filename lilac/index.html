<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#B57EDC">
  <title>Lilac - Recipe Discovery</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/icon-192.svg">
  <link rel="stylesheet" href="/css/lilac.css">
  <script>
    (function() {
      try {
        var t = localStorage.getItem('lilac_theme');
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- AUTH SCREEN (shown on first visit) -->
    <div id="auth-screen" class="auth-screen hidden">
      <div class="auth-container">
        <div class="auth-logo">
          <svg width="80" height="80" viewBox="0 0 192 192">
            <circle cx="96" cy="96" r="96" fill="#B57EDC"/>
            <text x="96" y="130" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="120" font-weight="bold" fill="white">L</text>
          </svg>
        </div>
        <h1 class="auth-title">lilac</h1>
        <p class="auth-subtitle">Who's cooking today?</p>
        <div id="auth-users" class="auth-users"></div>
      </div>
    </div>

    <!-- HEADER -->
    <header id="app-header" class="header">
      <div class="header-left">
        <svg class="header-logo" width="32" height="32" viewBox="0 0 192 192">
          <circle cx="96" cy="96" r="96" fill="#B57EDC"/>
          <text x="96" y="130" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="120" font-weight="bold" fill="white">L</text>
        </svg>
        <span class="header-title">lilac</span>
      </div>
      <div class="header-center">
        <div class="header-search" onclick="openSearch()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span>Search recipes...</span>
        </div>
      </div>
      <div class="header-right">
        <button class="header-btn" onclick="toggleTheme()" title="Toggle dark mode" id="theme-toggle-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="header-btn accent-btn" onclick="openAddRecipe()" title="Add recipe">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span class="btn-label">Add</span>
        </button>
        <button class="header-btn user-btn" onclick="showUserMenu()" id="user-avatar-btn" title="Account"></button>
      </div>
    </header>

    <!-- MAIN CONTENT -->
    <main id="main-content"></main>

    <!-- BOTTOM NAV -->
    <nav id="bottom-nav" class="bottom-nav">
      <button class="nav-item active" onclick="navigate('home')" data-tab="home">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-item" onclick="navigate('browse')" data-tab="browse">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Browse</span>
      </button>
      <button class="nav-item" onclick="navigate('discover')" data-tab="discover">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span>Discover</span>
      </button>
      <button class="nav-item" onclick="navigate('collection')" data-tab="collection">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        <span>Saved</span>
      </button>
    </nav>
  </div>

  <!-- SEARCH OVERLAY -->
  <div id="search-overlay" class="overlay hidden" onclick="if(event.target===this)closeSearch()">
    <div class="search-modal">
      <div class="search-input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search-input" placeholder="Search recipes..." oninput="handleSearch(this.value)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="close-btn" onclick="closeSearch()">&times;</button>
      </div>
      <div id="search-results" class="search-results"></div>
    </div>
  </div>

  <!-- ADD RECIPE MODAL -->
  <div id="add-recipe-overlay" class="overlay hidden" onclick="if(event.target===this)closeAddRecipe()">
    <div class="modal add-recipe-modal">
      <div class="modal-header">
        <h2>Add Recipe</h2>
        <button class="close-btn" onclick="closeAddRecipe()">&times;</button>
      </div>
      <div class="modal-body">
        <div id="add-recipe-url-section" class="add-url-section">
          <label>Paste a recipe URL</label>
          <div class="url-input-row">
            <input type="url" id="recipe-url-input" placeholder="https://example.com/recipe..." autocomplete="off">
            <button class="btn btn-accent" onclick="importRecipeFromUrl()" id="import-btn">Import</button>
          </div>
          <div id="import-status" class="import-status hidden"></div>
          <div class="divider-text"><span>or enter manually</span></div>
        </div>
        <form id="add-recipe-form" onsubmit="return saveNewRecipe(event)">
          <div class="form-grid">
            <div class="form-group full-width">
              <label for="recipe-title">Title *</label>
              <input type="text" id="recipe-title" required>
            </div>
            <div class="form-group full-width">
              <label for="recipe-description">Description</label>
              <textarea id="recipe-description" rows="2"></textarea>
            </div>
            <div class="form-group full-width">
              <label for="recipe-image">Image URL</label>
              <input type="url" id="recipe-image" placeholder="https://...">
            </div>
            <div class="form-group">
              <label for="recipe-prep-time">Prep Time (min)</label>
              <input type="number" id="recipe-prep-time" min="0">
            </div>
            <div class="form-group">
              <label for="recipe-cook-time">Cook Time (min)</label>
              <input type="number" id="recipe-cook-time" min="0">
            </div>
            <div class="form-group">
              <label for="recipe-servings">Servings</label>
              <input type="text" id="recipe-servings" placeholder="e.g. 4">
            </div>
            <div class="form-group">
              <label for="recipe-difficulty">Difficulty</label>
              <select id="recipe-difficulty">
                <option value="">Select...</option>
                <option value="easy">Easy</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
              </select>
            </div>
            <div class="form-group">
              <label for="recipe-cuisine">Cuisine</label>
              <select id="recipe-cuisine">
                <option value="">Select...</option>
                <option value="American">American</option>
                <option value="Asian">Asian</option>
                <option value="Caribbean">Caribbean</option>
                <option value="Chinese">Chinese</option>
                <option value="French">French</option>
                <option value="Greek">Greek</option>
                <option value="Indian">Indian</option>
                <option value="Italian">Italian</option>
                <option value="Japanese">Japanese</option>
                <option value="Korean">Korean</option>
                <option value="Mediterranean">Mediterranean</option>
                <option value="Mexican">Mexican</option>
                <option value="Middle Eastern">Middle Eastern</option>
                <option value="Southern">Southern</option>
                <option value="Thai">Thai</option>
                <option value="Vietnamese">Vietnamese</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="form-group">
              <label for="recipe-meal-type">Meal Type</label>
              <select id="recipe-meal-type">
                <option value="">Select...</option>
                <option value="breakfast">Breakfast</option>
                <option value="brunch">Brunch</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="snack">Snack</option>
                <option value="dessert">Dessert</option>
                <option value="appetizer">Appetizer</option>
                <option value="side">Side Dish</option>
                <option value="drink">Drink</option>
              </select>
            </div>
            <div class="form-group">
              <label for="recipe-gathering">Gathering Size</label>
              <select id="recipe-gathering">
                <option value="">Select...</option>
                <option value="solo">Solo</option>
                <option value="couple">Couple</option>
                <option value="family">Family</option>
                <option value="party">Party / Crowd</option>
              </select>
            </div>
            <div class="form-group full-width">
              <label>Dietary Tags</label>
              <div class="checkbox-group" id="dietary-checkboxes">
                <label class="checkbox-label"><input type="checkbox" value="vegetarian"> Vegetarian</label>
                <label class="checkbox-label"><input type="checkbox" value="vegan"> Vegan</label>
                <label class="checkbox-label"><input type="checkbox" value="gluten-free"> Gluten-Free</label>
                <label class="checkbox-label"><input type="checkbox" value="dairy-free"> Dairy-Free</label>
                <label class="checkbox-label"><input type="checkbox" value="keto"> Keto</label>
                <label class="checkbox-label"><input type="checkbox" value="paleo"> Paleo</label>
                <label class="checkbox-label"><input type="checkbox" value="nut-free"> Nut-Free</label>
                <label class="checkbox-label"><input type="checkbox" value="low-carb"> Low-Carb</label>
              </div>
            </div>
            <div class="form-group full-width">
              <label for="recipe-ingredients">Ingredients (one per line)</label>
              <textarea id="recipe-ingredients" rows="5" placeholder="1 cup flour&#10;2 eggs&#10;..."></textarea>
            </div>
            <div class="form-group full-width">
              <label for="recipe-instructions">Instructions (one step per line)</label>
              <textarea id="recipe-instructions" rows="5" placeholder="Step 1...&#10;Step 2..."></textarea>
            </div>
            <div class="form-group full-width">
              <label for="recipe-tags">Tags (comma-separated)</label>
              <input type="text" id="recipe-tags" placeholder="comfort food, weeknight, one-pot">
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" onclick="closeAddRecipe()">Cancel</button>
            <button type="submit" class="btn btn-accent">Save Recipe</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- RECIPE DETAIL MODAL -->
  <div id="recipe-detail-overlay" class="overlay hidden" onclick="if(event.target===this)closeRecipeDetail()">
    <div class="modal recipe-detail-modal">
      <div id="recipe-detail-content"></div>
    </div>
  </div>

  <!-- USER MENU -->
  <div id="user-menu-overlay" class="overlay hidden" onclick="if(event.target===this)closeUserMenu()">
    <div class="modal user-menu-modal">
      <div class="modal-header">
        <h2>Account</h2>
        <button class="close-btn" onclick="closeUserMenu()">&times;</button>
      </div>
      <div id="user-menu-content"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Firebase SDK (compat for vanilla JS) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <!-- App Scripts -->
  <script src="/js/firebase-config.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/recipes.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/browse.js"></script>
  <script src="/js/recommend.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
